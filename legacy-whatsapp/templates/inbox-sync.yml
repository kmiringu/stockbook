# Put this file at .github/workflows/sync.yml in a PRIVATE "inbox" repo.
# Upload a WhatsApp chat export (.txt) to that repo, from your phone if you like,
# and this updates the public stockbook ledger and page.
# One-time setup: add a write deploy key to the stockbook repo and save its private
# key as the secret STOCKBOOK_DEPLOY_KEY in the inbox repo (see README).
name: Update stock from WhatsApp export
on:
  push:
    paths: ["**.txt"]
  workflow_dispatch:
concurrency: stockbook
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: inbox }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.STOCKBOOK_REPO || 'kmiringu/stockbook' }}
          ssh-key: ${{ secrets.STOCKBOOK_DEPLOY_KEY }}
          path: stockbook
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Read exports and rebuild
        run: |
          cd stockbook
          shopt -s nullglob
          for f in ../inbox/*.txt ../inbox/**/*.txt; do
            echo "== $f"; python3 stock.py sync "$f" 2>&1 | tee -a ../log.txt
          done
          python3 stock.py status > ../status.txt
      - name: Publish
        run: |
          cd stockbook
          git config user.name "stockbook-bot"
          git config user.email "stockbook-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "stock: update from WhatsApp export ($(date -u +%d\ %b\ %H:%M) UTC)"
          git push
      - name: Summary
        run: |
          { echo '### Stock now (copy into the group)'; echo '```'; cat status.txt; echo '```';
            echo '### Sync log'; echo '```'; cat log.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

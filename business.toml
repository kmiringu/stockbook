# Stockbook config. Change this file to run the same system for any business.

[business]
name = "Gikambura Office Store"
subtitle = "Fundi Kanga stock: Hero welding rods"
currency = "KES"
# The date order in your phone's WhatsApp export: "dmy" (Kenya default) or "mdy"
date_format = "dmy"
# Only messages from these people count. Leave empty to accept anyone in the group.
trusted = []

# Each item tracks stock in its base unit. Other units convert into it.
[[items]]
key = "hero"
name = "Hero welding rods"
aliases = ["hero rods", "hero rod", "hero", "welding rods", "rods", "rod"]
base_unit = "pkt"
units = { pkt = 1, packet = 1, pack = 1, box = 4, ctn = 4 }
price = 1200        # selling price per pkt (estimated 1,150–1,200)
reorder_at = 80     # warn when balance falls to this many pkt (20 boxes)

# Add more items later by copying the block, e.g.
